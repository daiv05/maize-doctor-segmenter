[project]
name = "corn-leaf-segmentation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0,<13.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<1.3",
]

[project.optional-dependencies]
dev      = ["ipykernel", "jupyterlab", "matplotlib", "seaborn", "pytest", "ruff", "pyright"]
cloud    = ["modal>=0.64", "huggingface-hub>=0.30"]
segmentation = ["torch>=2.2,<2.13", "ultralytics==8.4.104", "faster-coco-eval==1.7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
include = ["src", "scripts"]
venvPath = "."
venv = ".venv"
